<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Łap Bułkę - Żukowo v5</title>
<style>
    * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background: linear-gradient(180deg,#1e2a3a,#0f172a); display:flex; flex-direction:column; align-items:center; font-family:'Segoe UI',sans-serif; color:white; padding:10px; }
  .card { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:16px; padding:10px 14px; width:100%; max-width:430px; backdrop-filter:blur(8px); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .logo { font-size:20px; font-weight:800; line-height:1.1; }
  .logo span { color:#fbbf24; }
  .stats { display:flex; gap:6px; }
  .pill { background:#fff; color:#111; border-radius:999px; padding:6px 10px; font-weight:700; font-size:13px; white-space:nowrap; }
  .pill.lives { background:#fecaca; }
  .pill.combo { background:#fde68a; }
  .hearts { font-size:16px; letter-spacing:2px; margin-top:6px; }
  canvas { width:100%; max-width:400px; height:auto; aspect-ratio:4/5; display:block; margin:10px auto 0; background: linear-gradient(180deg,#7dd3fc 0%, #bae6fd 35%, #dcfce7 70%, #86efac 100%); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  button, .wa-btn { padding:10px 16px; border-radius:999px; border:none; font-weight:800; cursor:pointer; font-size:14px; text-decoration:none; display:inline-block; text-align:center; }
  .primary { background:#fbbf24; color:#111; }
  .ghost { background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.2); }
  /* WhatsApp - zielony, jak kanał */
  .wa-btn { background:#25D366; color:#fff; box-shadow:0 4px 14px rgba(37,211,102,0.4); }
  .wa-btn:hover { background:#1fb857; }
  .wa-box { margin-top:12px; background:rgba(37,211,102,0.12); border:1px solid rgba(37,211,102,0.35); border-radius:12px; padding:10px 12px; text-align:center; }
  .wa-box p { margin:0 0 8px; font-size:13px; opacity:0.9; line-height:1.4; }
  .hint { font-size:12.5px; opacity:0.75; text-align:center; line-height:1.5; margin:8px 0 0; }
  .touch { display:none; gap:8px; margin-top:10px; width:100%; }
  .touch button { flex:1; padding:16px; font-size:20px; background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.25); }
  @media (max-width:600px){ .touch{display:flex;} }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo">🥖 ŁAP BUŁKĘ<br><span>ŻUKOWO</span></div>
    <div class="stats">
      <div class="pill">⭐ <span id="score">0</span></div>
      <div class="pill combo">🔥 x<span id="combo">1</span></div>
    </div>
  </div>
  <div class="hearts" id="hearts">❤️❤️❤️❤️❤️</div>
  <canvas id="game" width="400" height="500"></canvas>
  <div class="controls">
    <button class="primary" onclick="resetGame()">↻ Restart [SPACJA]</button>
    <button class="ghost" id="soundBtn" onclick="toggleSound()">🔊 Dźwięk</button>
    <button class="ghost" onclick="toggleMusic()">🎵 Muzyka</button>
  </div>
  <div class="touch">
    <button ontouchstart="holdLeft=true" ontouchend="holdLeft=false">⬅️</button>
    <button ontouchstart="holdRight=true" ontouchend="holdRight=false">➡️</button>
  </div>

  <!-- TWÓJ KANAŁ WHATSAPP -->
  <div class="wa-box">
    <p>Podoba Ci się gra? Obserwuj mój kanał po więcej!</p>
    <a class="wa-btn" href="https://whatsapp.com/channel/0029VbE8tys9MF8u9ZxpVy3s" target="_blank" rel="noopener">💬 Obserwuj na WhatsApp →</a>
  </div>

  <p class="hint">Komputer: ← → / A D • SPACJA = restart • M = dźwięk • N = muzyka<br>Telefon: przyciski ⬅️ ➡️ albo przeciągnij palcem po grze<br>Złap 3 z rzędu = combo x2, 6 z rzędu = combo x3!</p>
</div>

<script>
const c = document.getElementById('game');
const ctx = c.getContext('2d');
let score, lives, combo, comboStreak, gameOver, player, buns, particles, keys, holdLeft, holdRight, clouds, frame;
let soundOn = true, musicOn = false, audioCtx = null, musicTimer = null;
const WA_LINK = "https://whatsapp.com/channel/0029VbE8tys9MF8u9ZxpVy3s";

function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type='sine', vol=0.12, slide=null, delay=0){
  if(!soundOn) return;
  try{
    const ac = getAudio();
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sCatch = () => { tone(520,0.08,'sine',0.18); tone(780,0.12,'sine',0.18, null, 0.06); };
const sMiss = () => tone(220,0.25,'sawtooth',0.08,110);
const sOver = () => { tone(400,0.15,'triangle',0.18); tone(300,0.15,'triangle',0.18,null,0.15); tone(180,0.35,'triangle',0.2,null,0.3); };
const sStart = () => { tone(440,0.1,'sine',0.15); tone(660,0.12,'sine',0.15,null,0.1); };
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').textContent = soundOn?'🔊 Dźwięk':'🔇 Cicho'; if(soundOn) sCatch(); }
function toggleMusic(){
  musicOn=!musicOn;
  if(musicOn){ musicTimer=setInterval(()=>{ if(!gameOver) tone([523,659,784,659][Math.floor(Math.random()*4)],0.18,'sine',0.05); }, 450); }
  else clearInterval(musicTimer);
}
function resetGame(){
  score=0; combo=1; comboStreak=0; lives=5; gameOver=false; frame=0;
  player={x:155, y:435, w:90, h:38, speed:8};
  buns=[]; particles=[]; keys={}; holdLeft=false; holdRight=false;
  clouds=[{x:20,y:40,s:1},{x:220,y:70,s:0.7},{x:120,y:110,s:0.85}];
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  updateHearts(); sStart();
}
function updateHearts(){ document.getElementById('hearts').textContent = '❤️'.repeat(lives) + '🤍'.repeat(5-lives); }
resetGame();

document.addEventListener('keydown', e=>{
  getAudio();
  if(e.code==='Space'){ e.preventDefault(); if(gameOver) resetGame(); }
  if(e.key==='m'||e.key==='M') toggleSound();
  if(e.key==='n'||e.key==='N') toggleMusic();
  keys[e.key]=true;
});
document.addEventListener('keyup', e=> keys[e.key]=false);
function moveTouch(e){ e.preventDefault(); getAudio(); let x=e.touches[0].clientX - c.getBoundingClientRect().left; player.x=Math.max(0,Math.min(400-player.w, x-player.w/2)); }
c.addEventListener('touchstart', moveTouch);
c.addEventListener('touchmove', moveTouch);

function spawnBun(){ buns.push({x:Math.random()*360, y:-30, speed:0.9 + Math.random()*0.6 + score*0.004, rot:Math.random()*6, wob:Math.random()*6}); }
function addParticles(x,y){ for(let i=0;i<10;i++) particles.push({x,y,vx:(Math.random()-0.5)*3,vy:Math.random()*-2-1,life:30,col:['#fbbf24','#fde68a','#fff'][i%3]}); }
function drawBackground(){
  ctx.fillStyle='#4ade80'; ctx.fillRect(0,470,400,30);
  ctx.fillStyle='#166534'; ctx.font='28px sans-serif';
  ctx.fillText('🌲',10,470); ctx.fillText('🌲',360,470); ctx.fillText('🏠',30,430);
  ctx.fillStyle='#fff'; ctx.fillRect(35,445,38,20); ctx.fillStyle='#92400e'; ctx.fillRect(42,445,24,12);
  clouds.forEach(cl=>{ ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.ellipse(cl.x,cl.y,30*cl.s,14*cl.s,0,0,7); ctx.ellipse(cl.x+22*cl.s,cl.y+4,22*cl.s,10*cl.s,0,0,7); ctx.fill(); cl.x+=0.2; if(cl.x>430) cl.x=-50; });
}
function drawPlayer(){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.25)'; ctx.shadowBlur=6; ctx.shadowOffsetY=4;
  const g=ctx.createLinearGradient(0,player.y,0,player.y+player.h);
  g.addColorStop(0,'#a16207'); g.addColorStop(1,'#713f12');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(player.x,player.y); ctx.lineTo(player.x+player.w,player.y);
  ctx.lineTo(player.x+player.w-10,player.y+player.h); ctx.lineTo(player.x+10,player.y+player.h); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2;
  for(let y=player.y+9;y<player.y+player.h;y+=9){ ctx.beginPath(); ctx.moveTo(player.x+3,y); ctx.lineTo(player.x+player.w-3,y); ctx.stroke(); }
  ctx.strokeStyle='#fde68a'; ctx.lineWidth=2.5;
  for(let x=player.x+12;x<player.x+player.w;x+=16){ ctx.beginPath(); ctx.moveTo(x,player.y+3); ctx.lineTo(x-3,player.y+player.h-3); ctx.stroke(); }
  ctx.fillStyle='#451a03'; ctx.fillRect(player.x-3,player.y-4,player.w+6,7);
  ctx.fillStyle='white'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('KOSZYK',player.x+player.w/2,player.y+22);
  ctx.restore();
}
function drawBun(b){
  ctx.save(); ctx.translate(b.x+18,b.y+18); ctx.rotate(b.rot);
  ctx.shadowColor='rgba(0,0,0,0.2)'; ctx.shadowBlur=5;
  ctx.fillStyle='#f59e0b'; ctx.beginPath(); ctx.ellipse(0,0,22,15,0,0,7); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='#b45309'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-20,0); ctx.quadraticCurveTo(0,-14,20,0); ctx.stroke();
  ctx.fillStyle='#fff7ed'; ctx.fillRect(-11,-6,4,3); ctx.fillRect(0,-8,4,3); ctx.fillRect(9,-4,4,3);
  ctx.restore();
}
function update(){
  if(gameOver) return; frame++;
  if(keys['ArrowLeft']||keys['a']||keys['A']||holdLeft) player.x-=player.speed;
  if(keys['ArrowRight']||keys['d']||keys['D']||holdRight) player.x+=player.speed;
  player.x=Math.max(0,Math.min(400-player.w,player.x));
  if(frame%85===0) spawnBun();
  for(let i=buns.length-1;i>=0;i--){
    let b=buns[i]; b.y+=b.speed; b.rot+=0.015;
    if(b.y+28 > player.y && b.y < player.y+player.h+8 && b.x+36 > player.x-8 && b.x < player.x+player.w+8){
      comboStreak++;
      if(comboStreak>=6) combo=3; else if(comboStreak>=3) combo=2; else combo=1;
      score += 10*combo;
      document.getElementById('score').textContent=score;
      document.getElementById('combo').textContent=combo;
      addParticles(b.x+18, b.y+10); sCatch(); buns.splice(i,1); continue;
    }
    if(b.y>500){
      lives--; combo=1; comboStreak=0;
      document.getElementById('combo').textContent=combo;
      updateHearts(); sMiss(); buns.splice(i,1);
      if(lives<=0){ gameOver=true; sOver(); }
    }
  }
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; });
  particles=particles.filter(p=>p.life>0);
}
function draw(){
  ctx.clearRect(0,0,400,500);
  drawBackground();
  if(gameOver){
    ctx.fillStyle='rgba(15,23,42,0.72)'; ctx.fillRect(0,0,400,500);
    ctx.fillStyle='white'; ctx.textAlign='center';
    ctx.font='800 30px sans-serif'; ctx.fillText('KONIEC GRY!',200,210);
    ctx.font='18px sans-serif'; ctx.fillText('Wynik: '+score+'  •  Combo max: x'+combo,200,245);
    ctx.font='800 15px sans-serif'; ctx.fillStyle='#fbbf24';
    ctx.fillText('Naciśnij SPACJĘ, żeby zagrać od nowa',200,285);
    ctx.fillStyle='white'; ctx.font='13px sans-serif';
    ctx.fillText('Tip: złap 3 z rzędu, żeby dostać x2',200,310);
    ctx.fillText('Obserwuj kanał ⬇️ pod grą!',200,332);
    ctx.textAlign='left';
  } else {
    drawPlayer(); buns.forEach(drawBun);
    particles.forEach(p=>{ ctx.fillStyle=p.col; ctx.globalAlpha=p.life/30; ctx.fillRect(p.x,p.y,5,5); ctx.globalAlpha=1; });
    ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(20,12,100,8);
    ctx.fillStyle='#fbbf24'; ctx.fillRect(20,12, Math.min(100, comboStreak*16), 8);
  }
  requestAnimationFrame(()=>{ update(); draw(); });
}
draw();
</script>
</body>
</html>
